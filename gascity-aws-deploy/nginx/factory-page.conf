# Serves the page the agent edits, so an approval has a visible outcome.
#
# The root is the agent's work_dir, served directly from the working tree rather
# than from a copy. That is the point: what you load here is the file the agent
# just wrote, with no publish step in between that could make the page and the
# agent's claim disagree.
#
# Deliberately a plain page over plain HTTP, not a Telegram Mini App. A Mini App
# would need HTTPS and would only be visible inside Telegram; a public URL is
# better evidence that the agent changed something real. The tradeoff is that
# this page is anonymous and world-readable, so nothing user-specific belongs on
# it.
server {
    listen 8080;
    root /opt/gascity/site;
    index index.html;

    # The agent rewrites this file in place, so a cached copy shows an approval
    # as having done nothing.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }
}
