<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Builder - Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .status-list {
            padding: 20px;
        }

        .status-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .status-item.approved {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .status-item.pending {
            background: #fff3e0;
            border-left-color: #ff9800;
        }

        .status-item h3 {
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-icon {
            font-size: 24px;
        }

        .status-meta {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .approved-by {
            display: inline-block;
            background: rgba(76, 175, 80, 0.1);
            color: #2e7d32;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-top: 8px;
        }

        .footer {
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
        }

        .refresh-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            animation: pulse 2s infinite;
            margin-right: 5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .last-updated {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏗️ Landing Page Builder</h1>
            <p>Software Factory Demo</p>
        </div>

        <div class="status-list" id="statusList">
            <!-- Sections will be dynamically populated -->
        </div>

        <div class="last-updated">
            <span class="refresh-indicator"></span>
            <span id="lastUpdated">Loading...</span>
        </div>

        <div class="footer">
            Gas City Software Factory • Human-in-the-Loop Demo
        </div>
    </div>

    <script>
        const sections = [
            { id: 'hero', name: 'Hero Section', icon: '🎯' },
            { id: 'features', name: 'Features Section', icon: '⭐' },
            { id: 'auth', name: 'Auth Form', icon: '🔐' },
            { id: 'footer', name: 'Footer Section', icon: '📄' },
            { id: 'deployment', name: 'Final Deployment', icon: '🚀' }
        ];

        async function fetchSectionStatus(sectionId) {
            try {
                const response = await fetch(`/status/${sectionId}.json?_=${Date.now()}`);
                if (response.ok) {
                    return await response.json();
                }
            } catch (e) {
                console.log(`Section ${sectionId} not yet available`);
            }
            return { status: 'pending', approved_by: null, approved_at: null };
        }

        async function updateUI() {
            const container = document.getElementById('statusList');
            container.innerHTML = '';

            for (const section of sections) {
                const status = await fetchSectionStatus(section.id);
                
                const div = document.createElement('div');
                div.className = `status-item ${status.status}`;
                
                const statusIcon = status.status === 'approved' ? '✅' : '⏳';
                const statusText = status.status === 'approved' ? 'Deployed' : 'Awaiting Approval';
                
                let html = `
                    <h3>
                        <span class="status-icon">${section.icon}</span>
                        ${section.name}
                        <span style="margin-left: auto; font-size: 16px;">${statusIcon}</span>
                    </h3>
                    <div class="status-meta">Status: ${statusText}</div>
                `;
                
                if (status.status === 'approved' && status.approved_by) {
                    html += `<div class="approved-by">✓ Approved by ${status.approved_by}</div>`;
                }
                
                div.innerHTML = html;
                container.appendChild(div);
            }

            document.getElementById('lastUpdated').textContent = 
                `Last updated: ${new Date().toLocaleTimeString()}`;
        }

        // Initial load
        updateUI();

        // Refresh every 2 seconds
        setInterval(updateUI, 2000);
    </script>
</body>
</html>
